<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <title>数据库</title>
  <link rel="stylesheet" href="css/database.css">
</head>
<body>
  <main id="catalog-view" class="catalog shell">
    <header><h1>数据库</h1></header>
    <section id="table-list" class="table-list" aria-live="polite"><p class="muted">正在读取目录…</p></section>
  </main>

  <main id="grid-view" class="grid-view hidden">
    <header class="toolbar">
      <button id="back-button" class="icon-button" title="返回并锁定" aria-label="返回并锁定">‹</button>
      <div class="table-title"><strong id="current-table"></strong><span id="result-summary"></span></div>
      <button id="search-button" class="toolbar-button">搜索</button>
      <button id="clear-search-button" class="toolbar-button hidden">清除搜索</button>
    </header>
    <div id="grid" class="grid" tabindex="0" aria-label="数据表"><div id="grid-content" class="grid-content"></div></div>
  </main>

  <dialog id="password-dialog" class="modal">
    <form id="password-form" method="dialog" autocomplete="off">
      <h2 id="password-title">解锁数据表</h2>
      <label>密码<input id="password-input" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
      <p id="password-error" class="error" role="alert"></p>
      <div class="actions"><button id="cancel-password-button" type="button">取消</button><button id="unlock-button" type="submit">解锁</button></div>
    </form>
  </dialog>

  <dialog id="progress-dialog" class="modal progress-modal">
    <div class="progress-ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle id="progress-circle" class="value" cx="50" cy="50" r="42"/></svg><span id="progress-value"></span></div>
    <h2 id="progress-title">正在下载数据库…</h2><p id="progress-detail" class="muted"></p>
    <button id="cancel-load-button">取消</button>
  </dialog>

  <dialog id="search-dialog" class="modal search-modal">
    <form id="search-form" method="dialog">
      <header><h2>搜索</h2><button id="add-condition" type="button">添加条件</button></header>
      <div id="conditions" class="conditions"></div>
      <p id="search-error" class="error" role="alert"></p>
      <div class="actions"><button id="cancel-search-button" type="button">取消</button><button type="submit">搜索</button></div>
    </form>
  </dialog>
  <template id="condition-template"><div class="condition"><select aria-label="列名"></select><input type="text" aria-label="搜索文本" required><div class="match-toggles"><button type="button" data-flag="case" title="区分大小写">Aa</button><button type="button" class="whole-word-icon" data-flag="word" title="全字匹配"><span>ab</span></button><button type="button" data-flag="regex" title="使用正则表达式">.*</button></div><button type="button" class="remove-condition" title="删除条件" aria-label="删除条件">×</button></div></template>
  <script type="module" src="js/app.js"></script>
</body>
</html>
