<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>星系</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main aria-label="星系">
      <div class="controls">
        <select id="group" aria-label="选择棋盘尺寸"></select
        ><select id="level" aria-label="选择关卡"></select
        ><button id="undo" disabled>撤销</button><button id="reset">重开</button
        ><button id="zoom" aria-pressed="false">放大</button
        ><button id="help">规则</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="board-wrap"><div id="board"></div></div>
      <p class="note">点击格线添加或删除边界。</p>
    </main>
    <dialog id="rules">
      <h2>星系规则</h2>
      <p>
        沿格线划分区域。每个区域必须连通，只含一个圆心，并以该圆心旋转 180°
        后与自己重合。圆心可以在格心、边心或四格交点；圆心周围的格子须属于同一区域。不要在同一区域内部留下多余边界。
      </p>
      <p>
        Tab 切换格线，空格或回车切换边界；Delete 清除。 Ctrl / ⌘ + Z
        撤销。放大后可左右滑动棋盘。进度自动保存在此浏览器。
      </p>
      <button id="close-rules">继续游戏</button>
    </dialog>
    <dialog id="confirm">
      <h2>重新开始本关？</h2>
      <p>本关进度和撤销记录将被清除，其他关卡保留。</p>
      <div class="controls">
        <button id="cancel-reset">取消</button
        ><button id="confirm-reset">重新开始</button>
      </div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
