<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>桥梁</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main aria-label="桥梁">
      <div class="controls">
        <select id="group" aria-label="选择棋盘尺寸"></select
        ><select id="level" aria-label="选择关卡"></select
        ><button id="undo" disabled>撤销</button><button id="reset">重开</button
        ><button id="zoom" aria-pressed="false">放大</button
        ><button id="help">规则</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="board-wrap"><div id="board"></div></div>
      <p class="note">点击虚线：单桥 → 双桥 → 清空。</p>
    </main>
    <dialog id="rules">
      <h2>桥梁规则</h2>
      <p>
        在同一行或列的相邻岛屿间架桥。岛上数字等于连出的桥数，两岛间最多两座桥。桥不能交叉或穿过岛屿，最后所有岛屿必须连成一体。
      </p>
      <p>
        Tab 切换桥位，空格或回车切换；1 / 2 设置桥数，0 或 Delete 清除。 Ctrl /
        ⌘ + Z 撤销。放大后可左右滑动棋盘。进度自动保存在此浏览器。
      </p>
      <button id="close-rules">继续游戏</button>
    </dialog>
    <dialog id="confirm">
      <h2>重新开始本关？</h2>
      <p>本关进度和撤销记录将被清除，其他关卡保留。</p>
      <div class="controls">
        <button id="cancel-reset">取消</button
        ><button id="confirm-reset">重新开始</button>
      </div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
