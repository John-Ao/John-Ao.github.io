<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ef"><title>猜颜色</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><div class="status"><span id="progress">第 1 / 7 次</span><time id="timer">00:00.000</time><button id="share" class="quiet" aria-label="分享局面">分享 ↗</button></div><div id="board" aria-label="猜测棋盘"></div><div class="legend" id="legend"></div><div id="palette" aria-label="候选颜色"></div><div class="actions"><button id="menu">☰ 菜单</button><span id="message" role="status"></span><button id="confirm" class="primary">确认 ↵</button></div></main><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close" aria-label="关闭">✕</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
