<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f2"><title>Onitama</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../board_shared/style.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../board_shared/theme.css"><link rel="stylesheet" href="theme.css"><script src="../board_shared/theme.js" data-controls='.controls>.actions'></script></head><body><main><section class="play" aria-label="Onitama 棋局"><div class="hand" id="red" aria-label="红方走法牌"></div><div class="board" id="board" aria-label="五乘五棋盘"></div><div class="hand" id="blue" aria-label="蓝方走法牌"></div></section><section class="controls"><h1>Onitama</h1><p id="status" class="status" role="status"></p><p id="hint" class="muted" aria-live="polite"></p><p class="muted">待交换的牌</p><div id="side"></div><div class="actions"><button id="undo">悔棋</button><button id="reset">新牌局</button><button id="restart">重玩本局</button><button id="flip">翻转棋盘</button><button id="pass">无路可走 · 换牌</button><button id="draw">双方议和</button></div><p id="notice" role="status"></p><details><summary>规则</summary><p>每方有一名师父和四名弟子。所有棋子都按己方两张牌上的图案移动，可越过中间棋子，不能落在己方棋子上，落在敌方棋子上即吃子。</p><p>吃掉对方师父，或让己方师父走到对方寺庙，即获胜。师父不受“将军”限制。</p><p>每步用过的牌与旁边的牌交换。只有两张牌都完全无合法走法时，才能停步并交换一张牌。第五张牌的印记决定先手。牌面图案始终与当前棋盘方向一致。</p><p>双方议和为网页提供的结束循环对局功能。</p><a href="https://www.arcanewonders.com/wp-content/uploads/2021/05/Onitama-Rulebook.pdf" target="_blank" rel="noreferrer">官方规则</a></details></section></main><script type="module" src="app.js"></script></body></html>
