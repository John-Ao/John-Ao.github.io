<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2eb"><title>多米诺拼图</title><link rel="stylesheet" href="style.css"></head><body>
<main><div class="status"><button id="menu" aria-label="打开菜单">☰ 菜单</button><div><strong id="level"></strong><span id="progress"></span></div><time id="timer">00:00.000</time></div>
<div id="play"><div id="boardWrap"><svg id="board" role="img" aria-label="拼图棋盘"></svg></div><section id="tools" aria-label="可用积木"><div class="tray-title">可用积木 <span id="remaining"></span></div><div id="tray"></div><div id="selected"></div><div class="controls"><button id="rotate">↻ 旋转</button><button id="flip">⇄ 翻转</button><button id="remove">移出</button><button id="undo">↶ 撤回</button></div><p id="hint" role="status">选择积木，再点击棋盘放置；也可拖入棋盘。</p></section></div></main>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="close" aria-label="关闭弹窗">✕</button></div><div id="modalBody"></div></dialog><input type="file" id="import" accept="application/json,.json" hidden><script src="app.js"></script></body></html>
