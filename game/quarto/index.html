<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f0e9">
<title>连四棋</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<div class="arena">
<div class="pool" id="pool-first" role="group" aria-label="候选棋子，上方或左侧"></div>
<div id="board" role="group" aria-label="连四棋 四乘四棋盘"></div>
<div class="pool" id="pool-second" role="group" aria-label="候选棋子，下方或右侧"></div>
</div>
<div class="actions"><button id="undo">悔棋</button><button id="reset">重开</button><button id="theme" aria-label="切换日夜间模式">夜间</button><button id="network">联网</button></div>
<div class="online-info"><span id="turnStatus" hidden></span><span id="networkStatus" role="status" hidden></span><button id="reviewProposal" hidden>查看协商请求</button></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main>
<dialog id="networkDialog" aria-labelledby="networkTitle"><button class="close" data-close="networkDialog" aria-label="关闭联网菜单">×</button><h2 id="networkTitle">联网对战</h2><p id="networkMessage" role="status"></p><div class="orient"><button id="createRoom" hidden>创建房间</button><button id="resumeRoom" hidden>恢复房间</button><button id="joinRoom" hidden>加入邀请对局</button></div><section id="roomControls" hidden><section id="inviteControls" hidden><p id="inviteHint" hidden>访客席位已占用；邀请其他人前，请先重置访客席位。</p><label id="inviteLinkField">邀请链接<input id="shareLink" readonly aria-label="邀请链接"></label><div class="orient"><button id="inviteRoom">生成邀请</button><button id="copyInvite">复制链接</button></div></section><div class="orient"><button id="syncRoom">重新同步</button></div><button id="loginAgain">房主重新登录</button><button id="resetGuest">重置访客席位</button><button id="closeRoom">关闭房间</button><button id="leaveRoom">返回本地对局</button></section></dialog>
<dialog id="proposal" aria-labelledby="proposalTitle" aria-describedby="proposalText"><button class="close" data-close="proposal" aria-label="稍后处理协商请求">×</button><h2 id="proposalTitle"></h2><p id="proposalText"></p><div id="proposalActions" class="orient"><button id="rejectProposal">拒绝</button><button id="acceptProposal" class="primary">同意</button></div></dialog>
<dialog id="eventDialog" aria-labelledby="eventTitle" aria-describedby="eventMessage"><button class="close" data-close="eventDialog" aria-label="关闭提示">×</button><h2 id="eventTitle"></h2><p id="eventMessage"></p><div class="orient"><button id="eventCancel">取消</button><button id="eventAccept" class="primary">知道了</button></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
