<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sky Team</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../board_shared/theme.css"><link rel="stylesheet" href="theme.css"><script src="../board_shared/theme.js" data-controls='.titlebar>div'></script></head><body>
<main><div class="titlebar"><h1>Sky Team <small id="airportName">双人合作</small></h1><div><button id="flights">选择航班</button><button id="rules">规则</button><button id="restart">重新开始</button></div></div>
<section class="telemetry"><div><label>当前高度</label><strong id="altitude"></strong></div><div><label>进近距离</label><strong id="distance"></strong></div><div><label>回合</label><strong id="round"></strong></div><div><label>共享资源</label><strong id="resources"></strong></div></section>
<div id="flightInfo" class="flight-info"></div><section class="route" id="route" aria-label="进近航路"></section>
<div class="cockpit"><section class="panel pilot"><h2>机长 <span>蓝色</span></h2><div id="pilotSlots" class="slotgrid"></div></section><section class="center"><div class="instrument"><div class="ticks">−2　 −1　 0　 +1　 +2</div><div class="horizon"><div id="plane">✈</div></div><strong id="axisText"></strong><small>达到 ±3 即失控</small></div><div class="speed"><label>引擎 / 速度</label><strong id="speed"></strong><div id="speedBands"></div></div><div class="checks" id="checks"></div><h2>专注 <span>获得 1 杯咖啡</span></h2><div class="coffees" id="coffeeSlots"></div></section><section class="panel copilot"><h2>副驾驶 <span>橙色</span></h2><div id="copilotSlots" class="slotgrid"></div></section></div>
<section id="modules" class="module-board"></section><div class="flight-controls"><section class="hand" id="hand"></section><p id="hint" role="status" aria-live="polite"></p></div><details class="history"><summary>操作记录</summary><ol id="log"></ol></details>
</main><dialog id="modal"></dialog><script src="scenarios.js"></script><script src="engine.js"></script><script src="app.js"></script><script src="setup.js"></script></body></html>
