<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数回</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main aria-label="数回">
      <div class="controls">
        <label class="picker" for="group"
          >题组<select id="group" aria-label="选择题组"></select
        ></label>
        <label class="picker" for="level"
          >关卡<select id="level" aria-label="选择关卡"></select
        ></label>
        <button id="undo" disabled>撤销</button><button id="reset">重开</button
        ><button id="help">规则</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="board-wrap"><div id="board"></div></div>
      <p class="note">点击边：画线 → 标叉 → 清空。</p>
    </main>
    <dialog id="rules">
      <h2>数回规则</h2>
      <p>
        在点之间画线，使所有线组成一个没有分叉、没有交叉的闭环。每个数字表示围绕该格的四条边中，必须画出的线数。空白格不限制边数。叉仅用于记录排除，不计入答案。
      </p>
      <p>
        Tab 切换边，空格或回车操作；X 标叉，Delete 清空。 Ctrl / ⌘ + Z
        撤销。进度自动保存在此浏览器。
      </p>
      <button data-close="rules">继续游戏</button>
    </dialog>
    <dialog id="confirm">
      <h2>重新开始本关？</h2>
      <p>本关的标记和撤销记录将被清除，其他关卡进度保留。</p>
      <div class="controls">
        <button id="cancel-reset">取消</button
        ><button id="confirm-reset">重新开始</button>
      </div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
