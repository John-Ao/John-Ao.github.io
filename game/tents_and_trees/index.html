<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f4ed"><title>帐篷与树</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div class="toolbar"><button id="menu" aria-label="打开菜单" title="菜单"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="clock" aria-label="用时"><span id="timer">00:00</span><span id="ms">.000</span></div><button id="share" aria-label="分享局面" title="分享"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></button></div>
    <div id="board-area"><div id="board" class="board" role="group" aria-label="帐篷与树棋盘"></div></div>
    <div id="status" role="status"></div>
  </main>
  <dialog id="modal"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status"></div><input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
