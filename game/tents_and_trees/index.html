<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f4ed"><title>帐篷与树</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <button class="corner-button" id="menu" aria-label="打开菜单" title="菜单" aria-haspopup="dialog" aria-controls="modal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="corner-button" id="theme" aria-label="切换至夜间模式" title="切换至夜间模式" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3a9 9 0 1 0 10.5 11Z"/></svg></button>
    <button class="corner-button" id="shuffle" aria-label="重开一局" title="重开一局"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><g fill="currentColor" stroke="none"><circle cx="7.5" cy="7.5" r="1.3"/><circle cx="16.5" cy="7.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="7.5" cy="16.5" r="1.3"/><circle cx="16.5" cy="16.5" r="1.3"/></g></svg></button>
    <button class="corner-button" id="reset" aria-label="重玩本题" title="重玩本题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button>
    <div class="clock" aria-label="用时"><span id="timer">00:00</span><span id="ms">.000</span></div>
    <div id="board-area"><div id="board" class="board" role="group" aria-label="帐篷与树棋盘"></div></div>
    <div id="status" role="status"></div>
  </main>
  <dialog id="modal"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status"></div><input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
