<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toy Battle</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../board_shared/theme.css"><link rel="stylesheet" href="theme.css"><script src="../board_shared/theme.js" data-controls='main>.tools>div, #curtain>div'></script>
<body><main><section class="score red"><b>◆ 红方 <span id="redScore"></span></b><span id="redInfo"></span></section><div class="tools"><strong>Toy Battle <small id="mapName"></small></strong><div><button id="rulesBtn">规则</button><button id="historyBtn">记录</button><button id="newBtn">新局</button></div></div><section class="board" id="board" aria-label="城堡战场"></section><p id="mapNote"></p><section class="score blue"><b>● 蓝方 <span id="blueScore"></span></b><span id="blueInfo"></span></section><section class="control"><div class="status"><b id="status" aria-live="polite"></b><button id="hideBtn">隐藏手牌</button></div><p id="hint"></p><div id="hand" class="hand"></div><div id="choices" class="actions"></div><div class="actions"><button id="drawBtn">抽取 2 名援兵</button><button id="effectBtn">执行效果</button><button id="skipBtn">跳过效果</button><button id="inspectBtn">查看叠层</button></div><label class="privacy"><input type="checkbox" id="opposite"> 红方操作区旋转 180°（对坐）</label></section></main><div class="curtain" id="curtain"><div><span id="turnSymbol"></span><h1 id="curtainTitle"></h1><p>请将设备交给当前玩家，再显示手牌。</p><button id="readyBtn">准备好了，显示手牌</button><p><button id="curtainNew">选择地图 / 新局</button> <button id="curtainRules">规则</button></p></div></div><dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog">关闭</button></dialog><script src="maps.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
