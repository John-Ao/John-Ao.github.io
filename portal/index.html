<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Portal 管理</title><link rel="stylesheet" href="assets.css"><script type="module" src="admin.js?v=3"></script></head><body><main>
<h1>通信管理</h1>
<section aria-labelledby="connectionTitle"><h2 id="connectionTitle">Cloudflare Worker 连接测试</h2><p>服务地址：<code id="workerAddress"></code></p><button id="testConnection" type="button" aria-controls="connectionStatus">测试连接</button><p id="connectionStatus" class="status" role="status" aria-live="polite"></p></section>
<script type="module" src="connection.js"></script>
<p id="status" class="status" role="status" aria-live="polite"></p>
<form id="login"><label>Master password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button> <a href="setup.html">初始化公钥</a></form>
<section id="admin" hidden><div class="actions"><button id="refresh">刷新房间</button><button id="export">导出公开恢复配置</button><button id="logout">退出登录</button></div><p><small id="fingerprint"></small></p>
<table><thead><tr><th>房间</th><th>状态</th><th>操作</th></tr></thead><tbody id="rooms"></tbody></table>
<section aria-labelledby="keysTitle"><h2 id="keysTitle">游戏密钥</h2><form id="createKeyInvite"><label>密钥别名<input id="keyAlias" maxlength="80" placeholder="例如：小明" required></label><button type="submit">创建 5 分钟注册链接</button></form>
<label id="keyInviteResult" hidden>密钥注册链接<input id="keyInviteLink" readonly></label><p id="keyInviteExpiry"></p>
<div class="actions"><button id="copyKeyInvite" hidden>复制注册链接</button><button id="refreshKeys">刷新密钥</button></div>
<table><thead><tr><th>密钥与别名</th><th>使用情况</th><th>操作</th></tr></thead><tbody id="keys"></tbody></table>
<details><summary>注册链接状态</summary><div id="keyInvitations"></div></details></section>
<details><summary>轮换 master password</summary><p>轮换会关闭全部房间并撤销全部会话。请保存生成的公开恢复配置。</p><form id="rotate"><label>当前密码<input id="currentPassword" type="password" autocomplete="current-password" required></label><label>新密码（至少 16 字符）<input id="newPassword" type="password" autocomplete="new-password" minlength="16" required></label><label>重复新密码<input id="repeatPassword" type="password" autocomplete="new-password" required></label><button type="submit">更换密码并关闭全部房间</button></form></details>
</section><dialog id="keyConfirm" aria-labelledby="keyConfirmTitle"><h2 id="keyConfirmTitle">撤销此密钥？</h2><p>该密钥将无法登录，其会话及创建的房间将关闭。</p><div class="actions"><button id="cancelKeyRevoke">取消</button><button id="acceptKeyRevoke">撤销密钥</button></div></dialog></main></body></html>
