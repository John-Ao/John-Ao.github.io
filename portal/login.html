<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>游戏登录</title><link rel="stylesheet" href="assets.css"><script type="module" src="login.js?v=2"></script></head><body><main><h1>游戏登录</h1>
<label>通信线路<select id="portalRoute"></select></label><p id="routeStatus" class="status" role="status"></p><script type="module" src="route-selector.js"></script>
