<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>初始化公钥</title><link rel="stylesheet" href="assets.css"><script type="module" src="setup.js"></script></head><body><main><h1>初始化管理员公钥</h1><p>密码仅在当前浏览器中用于派生密钥。请使用高强度随机口令，并保存公开恢复配置。</p><form id="setup"><label>Master password（至少 16 字符）<input id="password" type="password" autocomplete="new-password" minlength="16" required></label><label>重复密码<input id="repeat" type="password" autocomplete="new-password" required></label><button type="submit">生成公钥和配置</button></form><p id="status" class="status" role="status" aria-live="polite"></p><section id="result" hidden><label>Cloudflare ADMIN_PUBLIC_KEY<input id="publicKey" readonly></label><label>Cloudflare KDF_CONFIG<textarea id="kdf" readonly></textarea></label><button id="download">下载公开恢复配置</button><p>将上面两项配置到 Worker，再在 portal/config.js 填写 Worker 地址。恢复身份需要原密码和相同的 KDF 配置。</p></section><a href="index.html">返回管理</a></main></body></html>
