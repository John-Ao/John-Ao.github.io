<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e9e3" />
    <meta name="description" content="明日方舟：终末地角色 3D 模型与骨骼动画查看器。" />
    <title>角色模型 · 明日方舟：终末地</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 8a8 8 0 1 1-1 7M4 3v5h5"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7m0-11v1"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 4v16M12 4v16M20 4v16M1 8h6m2 8h6m2-9h6"/></symbol>
    </svg>

    <main id="viewer" aria-label="明日方舟：终末地角色模型查看器">
      <div id="viewport" aria-label="3D 角色模型，拖动旋转，滚轮缩放"></div>

      <section class="character-info interface" aria-labelledby="character-name">
        <button id="choose-character" class="choose-character" type="button" aria-haspopup="dialog" aria-controls="roster-dialog">
          <svg class="icon" aria-hidden="true"><use href="#i-grid" /></svg>
          <span>选择角色</span>
          <svg class="icon arrow-small" aria-hidden="true"><use href="#i-arrow" /></svg>
        </button>
        <div class="identity">
          <p id="character-en" class="character-en"></p>
          <h1 id="character-name">角色模型</h1>
          <div id="character-meta" class="character-meta"></div>
        </div>
        <div class="character-pagination" aria-label="切换角色">
          <button id="previous-character" class="icon-button" type="button" title="上一位角色" aria-label="上一位角色"><svg class="icon flipped" aria-hidden="true"><use href="#i-arrow" /></svg></button>
          <output id="character-position" aria-live="polite">— / —</output>
          <button id="next-character" class="icon-button" type="button" title="下一位角色" aria-label="下一位角色"><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
        </div>
      </section>

      <div class="utility-controls interface">
        <button id="source-open" class="icon-button" type="button" title="资源与说明" aria-label="资源与说明" aria-haspopup="dialog" aria-controls="sources-dialog"><svg class="icon" aria-hidden="true"><use href="#i-info" /></svg></button>
        <button id="screenshot" class="icon-button" type="button" title="保存画面" aria-label="保存画面"><svg class="icon" aria-hidden="true"><use href="#i-camera" /></svg></button>
        <button id="fullscreen" class="icon-button" type="button" title="全屏" aria-label="全屏"><svg class="icon" aria-hidden="true"><use href="#i-expand" /></svg></button>
      </div>
      <button id="hide-ui" class="icon-button hide-ui" type="button" title="隐藏界面" aria-label="隐藏界面" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye" /></svg></button>

      <button id="toggle-animations" class="animation-toggle interface" type="button" aria-controls="animation-panel" aria-expanded="false">选择动作</button>
      <section id="animation-panel" class="animation-panel interface" aria-labelledby="animation-heading">
        <div class="panel-heading"><h2 id="animation-heading">动作</h2><span id="clip-count" class="count">0</span></div>
        <div class="animation-filters">
          <label class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search" /></svg><input id="animation-search" type="search" aria-label="搜索动作" placeholder="搜索动作" autocomplete="off" /></label>
          <label class="visually-hidden" for="animation-category">动作类别</label>
          <select id="animation-category"><option value="all">全部动作</option><option value="idle">待机</option><option value="combat">战斗</option><option value="movement">移动</option><option value="interaction">交互</option><option value="other">其他</option></select>
        </div>
        <div id="animations" class="animations" role="list" aria-label="可用动作"></div>
      </section>

      <section class="stage-controls interface" aria-label="场景设置">
        <div class="view-controls" role="group" aria-label="镜头视角">
          <button id="view-front" type="button" class="view-button">正面</button>
          <button id="view-back" type="button" class="view-button">背面</button>
          <button id="view-face" type="button" class="view-button">面部</button>
          <button id="reset-camera" type="button" class="icon-button" title="重置镜头" aria-label="重置镜头"><svg class="icon" aria-hidden="true"><use href="#i-reset" /></svg></button>
        </div>
        <div class="scene-options">
          <label class="check-control"><input id="auto-rotate" type="checkbox" /><span>自动旋转</span></label>
          <label class="check-control"><input id="show-grid" type="checkbox" /><span>地面网格</span></label>
          <label class="background-control"><span>背景</span><select id="background" aria-label="背景颜色"><option value="light">浅色</option><option value="gray">灰色</option><option value="dark">深色</option></select></label>
        </div>
      </section>

      <section class="player interface" aria-label="动作播放控制">
        <button id="play" class="play-button" type="button" title="播放 / 暂停" aria-label="播放 / 暂停"><svg class="icon" aria-hidden="true"><use href="#i-play" /></svg></button>
        <button id="restart" class="icon-button" type="button" title="重新播放" aria-label="重新播放"><svg class="icon" aria-hidden="true"><use href="#i-restart" /></svg></button>
        <div class="timeline-wrap"><label class="visually-hidden" for="timeline">播放进度</label><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" /><output id="time">0:00 / 0:00</output></div>
        <label class="speed-control"><span class="visually-hidden">播放速度</span><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
        <label class="check-control loop-control"><input id="loop" type="checkbox" checked /><span>循环</span></label>
      </section>
      <p class="gesture-help interface">拖动旋转<span>·</span>滚轮缩放<span>·</span>右键平移</p>

      <section id="loading" class="loading" aria-live="polite" aria-busy="true"><span class="loading-mark" aria-hidden="true"></span><p id="loading-label">正在加载角色资源</p><progress id="loading-progress" max="100" aria-label="加载进度"></progress></section>
      <section id="error" class="error-panel" hidden aria-live="assertive"><h2>资源暂时无法加载</h2><p id="error-text"></p><button id="retry" class="primary-button" type="button">重新加载</button></section>
    </main>

    <dialog id="roster-dialog" class="roster-dialog" aria-labelledby="roster-heading">
      <div class="dialog-heading"><div><h2 id="roster-heading">选择角色</h2><p id="roster-count" class="dialog-subtitle"></p></div><button class="icon-button" type="button" data-close="roster-dialog" aria-label="关闭角色选择"><svg class="icon" aria-hidden="true"><use href="#i-close" /></svg></button></div>
      <div class="roster-filters"><label class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search" /></svg><input id="search" type="search" placeholder="搜索角色" aria-label="搜索角色" autocomplete="off" /></label><label class="visually-hidden" for="element-filter">筛选属性</label><select id="element-filter"><option value="all">全部属性</option><option value="physical">物理</option><option value="heat">灼热</option><option value="electric">电磁</option><option value="cryo">寒冷</option><option value="nature">自然</option></select></div>
      <div id="roster" class="roster" aria-label="角色列表"></div>
    </dialog>

    <dialog id="sources-dialog" class="sources-dialog" aria-labelledby="sources-heading">
      <div class="dialog-heading"><h2 id="sources-heading">资源与说明</h2><button class="icon-button" type="button" data-close="sources-dialog" aria-label="关闭资源说明"><svg class="icon" aria-hidden="true"><use href="#i-close" /></svg></button></div>
      <div class="sources-body"><p>明日方舟：终末地角色模型与骨骼动画展示。角色资源归原权利人所有。</p><div id="sources-content"></div><dl class="source-links"><div><dt>模型与动作资源</dt><dd><a href="https://studio.warfarin.wiki/" target="_blank" rel="noopener noreferrer">Warfarin Studio <span aria-hidden="true">↗</span></a></dd></div><div><dt>官方角色资料</dt><dd><a href="https://endfield.hypergryph.com/operator" target="_blank" rel="noopener noreferrer">明日方舟：终末地 <span aria-hidden="true">↗</span></a></dd></div></dl><p class="source-note">模型以浏览器实时渲染，光照、材质与游戏内最终效果可能存在差异。资源首次加载需要一些时间。</p></div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
