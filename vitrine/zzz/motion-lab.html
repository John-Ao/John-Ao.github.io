<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色材质与动作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20221e;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #d4e394;outline-offset:-3px}aside{position:absolute;top:20px;left:24px;width:400px;max-width:calc(100vw - 32px);background:#111e;padding:18px;border-radius:10px}h1{font-size:20px;margin:0 0 14px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0}p,summary{line-height:1.6;color:#bbb;font-size:13px}button,select,a{color:#e4ef9c}button,select{font:inherit;background:#303329;padding:8px;border:1px solid #777;border-radius:5px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #e4ef9c;outline-offset:2px}button:disabled{opacity:.45}#timeline{width:100%;margin:8px 0;accent-color:#d4e394}output{font-variant-numeric:tabular-nums;color:#d5d5ce;font-size:12px}#status{font-size:12px}details{margin:12px 0}details p{margin:8px 0}label{color:#d0d0c8}input[type=checkbox]{accent-color:#d4e394}.hint{margin-bottom:6px}.links{font-size:12px;margin-bottom:0}
@media(max-width:700px){aside{left:16px;top:auto;bottom:12px;width:calc(100vw - 32px);max-height:43vh;overflow:auto;padding:12px}h1{font-size:16px;margin-bottom:8px}.row{margin:6px 0}button,select{font-size:12px;padding:6px}.hint,details{font-size:12px}}
</style>
</head>
<body>
<canvas tabindex="0" aria-label="角色三维展示，拖动或使用方向键环绕观察，滚轮缩放"></canvas>
<aside>
<h1>角色材质与动作</h1>
<div class="row"><select id="character" aria-label="选择角色"><option value="anby">安比</option><option value="corin">可琳</option><option value="nicole">妮可</option></select><select id="clip" aria-label="选择动画"><option value="idle">战斗待机 · Idle</option><option value="turn-back">战斗转身 · TurnBack</option></select></div>
<div class="row"><select id="render-mode" aria-label="渲染方式"><option value="toon">角色材质</option><option value="original">原基础材质 · 对照</option></select><select id="framing" aria-label="镜头范围"><option value="full">全身</option><option value="portrait">半身细节</option></select><button id="reset-view">复位镜头</button></div>
<div class="row"><button id="replay">重新播放</button><button id="pause" aria-pressed="false">暂停</button><label><input id="follow" type="checkbox" checked>镜头跟随位移</label></div>
<input id="timeline" type="range" aria-label="动画时间" min="0" max="1" step="any" value="0" disabled>
<output id="time" for="timeline">0.000 / 0.000 秒</output>
<p class="hint">拖动环绕 · 滚轮缩放 · 拖动时间轴检查原始姿势</p>
<p id="status" role="status">载入模型…</p>
<details><summary>素材与复刻范围</summary><p><span id="catalog-summary"></span>其余模型保持源文件绑定姿势，部分武器尚未装配。星见雅的面部曲线尚未映射，缺失权重的武器采用原 Prefab 根骨骼刚性绑定。此处为原始战斗动画，不作为菜单转身使用。镜头环绕不改变角色骨骼。角色材质依据解包贴图与 UI 参数重建，尚非官方渲染的完整复刻。</p></details>
<p class="links"><a href="./">返回角色展示</a> · <a href="https://github.com/oOIEririIOo/ZZZDemo/tree/main/Assets/Arts" target="_blank" rel="noreferrer">动作来源</a> · <a href="./RESEARCH.md">研究记录</a></p>
</aside>
<script type="module" src="./motion-lab.js"></script>
</body></html>
