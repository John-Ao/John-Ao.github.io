<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word 模板替换</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      background: #f0f0f0;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── 顶栏 ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #217346;
      color: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      flex-shrink: 0;
    }

    .topbar .title {
      font-size: 15px;
      font-weight: 600;
    }

    .topbar .spacer {
      flex: 1;
    }

    .topbar button {
      padding: 5px 14px;
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: 4px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }

    .topbar button:hover:not(:disabled) {
      background: rgba(255, 255, 255, .3);
    }

    .topbar button:active:not(:disabled) {
      background: rgba(255, 255, 255, .45);
    }

    .topbar button:disabled {
      opacity: .4;
      cursor: default;
    }

    .topbar button.primary {
      background: #fff;
      color: #217346;
      border-color: #fff;
      font-weight: 600;
    }

    .topbar button.primary:hover:not(:disabled) {
      background: #e8f5ee;
    }

    .topbar .count {
      font-size: 12px;
      opacity: .9;
    }

    /* ── 屏幕容器 ── */
    .screen {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .screen.hidden {
      display: none;
    }

    /* ── 界面1：上传分屏 ── */
    #upload-screen {
      flex-direction: row;
      gap: 16px;
      padding: 16px;
    }

    .dropzone {
      flex: 1;
      border: 2px dashed #b0b0b0;
      border-radius: 10px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
      overflow: hidden;
    }

    .dropzone:hover {
      border-color: #217346;
      background: #f8fbf9;
    }

    .dropzone.drag-over {
      border-color: #217346;
      background: #e8f5ee;
    }

    .dropzone.has-file {
      cursor: default;
      border-style: solid;
      border-color: #c0c0c0;
      justify-content: flex-start;
      align-items: stretch;
    }

    .dropzone.has-file .file-card {
      align-items: stretch;
      flex-shrink: 0;
    }

    .dz-preview {
      display: none;
      flex: 1;
      width: 100%;
      overflow: auto;
      margin-top: 10px;
      border-top: 1px solid #e8e8e8;
      padding-top: 10px;
      font-size: 13px;
      color: #333;
      user-select: text;
    }

    .dropzone.has-file .dz-preview {
      display: block;
    }

    .dz-preview .preview-empty {
      color: #999;
      text-align: center;
      padding: 20px 0;
    }

    .dz-preview .docx-html {
      line-height: 1.5;
    }

    .dz-preview .docx-html p {
      margin: 0 0 6px;
    }

    .dz-preview .docx-html table {
      border-collapse: collapse;
      margin: 6px 0;
    }

    .dz-preview .docx-html td,
    .dz-preview .docx-html th {
      border: 1px solid #c8c8c8;
      padding: 3px 6px;
    }

    .tbl-preview {
      border-collapse: collapse;
      font-size: 12px;
      width: 100%;
    }

    .tbl-preview td,
    .tbl-preview th {
      border: 1px solid #d0d0d0;
      padding: 3px 6px;
      white-space: nowrap;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tbl-preview tr:first-child td {
      background: #f0f4f1;
      font-weight: 600;
      color: #217346;
    }

    .dropzone .dz-icon {
      font-size: 40px;
      color: #9bbfaa;
      line-height: 1;
    }

    .dropzone .dz-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    .dropzone .dz-hint {
      font-size: 12px;
      color: #888;
    }

    .dropzone .file-card {
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .dropzone.has-file .file-card {
      display: flex;
    }

    .dropzone.has-file .dz-icon,
    .dropzone.has-file .dz-title,
    .dropzone.has-file .dz-hint {
      display: none;
    }

    .dropzone .file-name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      max-width: 360px;
      word-break: break-all;
    }

    .dropzone .file-size {
      font-size: 12px;
      color: #888;
    }

    .dropzone .file-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dropzone .file-actions button {
      padding: 3px 12px;
      border: 1px solid #c0c0c0;
      border-radius: 4px;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
      font-size: 12px;
    }

    .dropzone .file-actions button:hover {
      background: #e8e8e8;
    }

    .dropzone .file-actions .remove-btn {
      border-color: #d09090;
      color: #a04040;
    }

    .dropzone .file-actions .remove-btn:hover {
      background: #fbeaea;
    }

    .dropzone .dz-tag {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11px;
      color: #999;
    }

    /* ── 界面2：结果 ── */
    #results-screen {
      flex-direction: row;
    }

    #file-list {
      width: 300px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #d8d8d8;
      overflow-y: auto;
      padding: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: background .12s;
    }

    .file-item:hover {
      background: #f0f4f1;
    }

    .file-item.active {
      background: #e1ece4;
    }

    .file-item .seq {
      flex-shrink: 0;
      color: #217346;
      font-weight: 600;
      font-size: 12px;
      min-width: 28px;
      font-variant-numeric: tabular-nums;
    }

    .file-item .fname {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .file-item .dl-btn {
      flex-shrink: 0;
      padding: 2px 8px;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
      font-size: 11px;
    }

    .file-item .dl-btn:hover {
      background: #e8e8e8;
    }

    #preview-pane {
      flex: 1;
      overflow: auto;
      background: #f0f0f0;
      padding: 0;
      position: relative;
    }

    #preview-pane .preview-empty {
      color: #999;
      text-align: center;
      margin-top: 40px;
    }

    #preview-pane .docx-html {
      color: #1a1a1a;
      line-height: 1.6;
    }

    #preview-pane .docx-html p {
      margin: 0 0 8px;
    }

    #preview-pane .docx-html table {
      border-collapse: collapse;
      margin: 8px 0;
    }

    #preview-pane .docx-html td,
    #preview-pane .docx-html th {
      border: 1px solid #c0c0c0;
      padding: 4px 8px;
    }

    #preview-pane .docx-html img {
      max-width: 100%;
    }

    /* ── 状态/加载 ── */
    .status-bar {
      flex-shrink: 0;
      height: 24px;
      line-height: 24px;
      padding: 0 14px;
      background: #e8e8e8;
      border-top: 1px solid #c0c0c0;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }

    #overlay.show {
      display: flex;
    }

    #overlay .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #d0d0d0;
      border-top-color: #217346;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    #overlay .overlay-text {
      margin-left: 12px;
      font-size: 14px;
      color: #333;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 999;
      max-width: 80vw;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      background: #a04040;
    }

    /* ── 加载示例按钮 ── */
    .topbar button.sample-btn {
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .6);
    }

    /* ── 高亮 span（模板/结果预览中命中的替换文本） ── */
    .wr-hl {
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .06) inset;
    }

    /* 隐藏替换高亮：!important 覆盖 span 的内联 background-color */
    body.hl-off .wr-hl {
      background-color: transparent !important;
      box-shadow: none !important;
    }

    /* 替换高亮拨动开关 */
    .hl-switch {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #fff;
    }

    .hl-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .hl-track {
      position: relative;
      width: 36px;
      height: 20px;
      border-radius: 11px;
      background: rgba(255, 255, 255, .3);
      transition: background .15s;
      flex-shrink: 0;
    }

    .hl-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: left .15s, background .15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    }

    .hl-switch input:checked+.hl-track {
      background: #fff;
    }

    .hl-switch input:checked+.hl-track .hl-knob {
      left: 18px;
      background: #217346;
    }

    .hl-switch input:focus-visible+.hl-track {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 1px;
    }

    /* ── 表格预览列高亮 ── */
    .tbl-preview td.col-hl-head {
      font-weight: 600;
    }

    .tbl-preview td.col-hl-data {
      border-left-width: 2px;
    }

    /* ── 结果界面：替换情况浮窗 ── */
    #replace-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 360px;
      max-width: calc(100vw - 60px);
      max-height: calc(100% - 28px);
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow: hidden;
    }

    #replace-panel.collapsed {
      width: auto;
      max-height: none;
    }

    #replace-panel .rp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: #217346;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: move;
      user-select: none;
    }

    #replace-panel .rp-head .rp-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #replace-panel .rp-head button {
      padding: 1px 8px;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 3px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.4;
    }

    #replace-panel .rp-head button:hover {
      background: rgba(255, 255, 255, .3);
    }

    #replace-panel .rp-body {
      overflow: auto;
      padding: 8px;
    }

    #replace-panel .rp-empty {
      color: #999;
      font-size: 12px;
      text-align: center;
      padding: 12px 0;
    }

    #replace-panel table.rp-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }

    #replace-panel table.rp-table th,
    #replace-panel table.rp-table td {
      border: 1px solid #e0e0e0;
      padding: 4px 8px;
      vertical-align: top;
      word-break: break-all;
    }

    #replace-panel table.rp-table th {
      background: #f0f4f1;
      color: #217346;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
    }

    #replace-panel table.rp-table td.rp-search {
      font-weight: 600;
      color: #1a1a1a;
    }

    #replace-panel table.rp-table td.rp-replace {
      color: #333;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <span class="title">Word 模板替换</span>
    <button id="sample-btn" class="sample-btn">加载示例</button>
    <label class="hl-switch" id="hl-toggle" title="显示/隐藏替换高亮">
      <input type="checkbox" id="hl-checkbox" checked>
      <span class="hl-track"><span class="hl-knob"></span></span>
      <span class="hl-label">替换高亮</span>
    </label>
    <span class="spacer"></span>
    <button id="convert-btn" class="primary" disabled>转换</button>
    <button id="back-btn" class="hidden" style="display:none">返回</button>
    <button id="download-all-btn" style="display:none">下载全部 (zip)</button>
    <span id="result-count" class="count" style="display:none"></span>
  </div>

  <!-- 界面1：上传 -->
  <div id="upload-screen" class="screen">
    <div class="dropzone" id="tpl-zone" data-kind="template">
      <span class="dz-tag">模板</span>
      <div class="dz-icon">📄</div>
      <div class="dz-title">Word 模板</div>
      <div class="dz-hint">拖入或点击选择 .docx 文件</div>
      <div class="file-card">
        <div class="file-name"></div>
        <div class="file-size"></div>
        <div class="file-actions">
          <button class="replace-btn">替换</button>
          <button class="remove-btn">✕ 取消</button>
        </div>
      </div>
      <div class="dz-preview"></div>
    </div>
    <div class="dropzone" id="tbl-zone" data-kind="table">
      <span class="dz-tag">表格</span>
      <div class="dz-icon">📊</div>
      <div class="dz-title">替换表格</div>
      <div class="dz-hint">拖入或点击选择 .xlsx 文件</div>
      <div class="file-card">
        <div class="file-name"></div>
        <div class="file-size"></div>
        <div class="file-actions">
          <button class="replace-btn">替换</button>
          <button class="remove-btn">✕ 取消</button>
        </div>
      </div>
      <div class="dz-preview"></div>
    </div>
  </div>

  <!-- 界面2：结果 -->
  <div id="results-screen" class="screen hidden" style="display:none">
    <div id="file-list"></div>
    <div id="preview-pane">
      <div id="preview-content">
        <div class="preview-empty">从左侧选择一个文件查看预览</div>
      </div>
      <div id="replace-panel" style="display:none">
        <div class="rp-head">
          <span class="rp-title">替换情况</span>
          <button class="rp-toggle" title="收起/展开">—</button>
        </div>
        <div class="rp-body"></div>
      </div>
    </div>
  </div>

  <div class="status-bar"><span id="status-left">就绪。上传模板与表格后即可转换。</span></div>

  <input type="file" id="tpl-input" accept=".docx" style="display:none">
  <input type="file" id="tbl-input" accept=".xlsx,.xls" style="display:none">

  <div id="overlay">
    <div class="spinner"></div><span class="overlay-text">处理中…</span>
  </div>
  <div id="toast"></div>

  <script>
    // ─────────────────────────────────────────────
    //  常量
    // ─────────────────────────────────────────────
    const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const XML_NS = 'http://www.w3.org/XML/1998/namespace';
    const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

    const CDN = {
      xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      pizzip: 'https://cdn.jsdelivr.net/npm/pizzip/dist/pizzip.js',
      jszip: 'https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js',
      docxPreview: 'https://cdn.jsdelivr.net/npm/docx-preview/dist/docx-preview.min.js',
    };

    // ─────────────────────────────────────────────
    //  颜色（每个替换词一种颜色，全流程共用）
    // ─────────────────────────────────────────────
    const PALETTE = [
      '#FFF59D', '#90CAF9', '#A5D6A7', '#FFAB91',
      '#CE93D8', '#FFCC80', '#80DEEA', '#F48FB1',
      '#C5E1A5', '#B0BEC5', '#B39DDB', '#9FA8DA',
    ];
    const colorOf = (i) => PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length];

    function hexToRgb(hex) {
      const h = (hex || '').replace('#', '').trim();
      return h.length === 6
        ? { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) }
        : { r: 200, g: 200, b: 200 };
    }
    function hexToRgba(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    // 读取 hex（用于 OOXML w:shd w:fill，需无 # 的 6 位 hex）
    const fillHex = (hex) => (hex || '').replace('#', '').trim();

    // ─────────────────────────────────────────────
    //  CDN 动态加载（泛化自 ai/table.html 的 ensureXLSX）
    // ─────────────────────────────────────────────
    const libPromises = {};
    function ensureLib(key, url, globalName) {
      if (window[globalName]) return Promise.resolve(window[globalName]);
      if (libPromises[key]) return libPromises[key];
      libPromises[key] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => window[globalName] ? resolve(window[globalName])
          : (libPromises[key] = null, reject(new Error(`${key} 库已加载但未暴露全局 ${globalName}`)));
        s.onerror = () => { libPromises[key] = null; reject(new Error(`无法加载 ${key} 库（需联网）：${url}`)); };
        document.head.appendChild(s);
      });
      return libPromises[key];
    }
    const ensureXLSX = () => ensureLib('xlsx', CDN.xlsx, 'XLSX');
    const ensurePizip = () => ensureLib('pizzip', CDN.pizzip, 'PizZip');
    async function ensureDocxPreview() {
      if (window.docx && window.docx.renderAsync) return window.docx;
      await ensureLib('jszip', CDN.jszip, 'JSZip');        // docx-preview 的外部依赖，须先就位
      return ensureLib('docx-preview', CDN.docxPreview, 'docx');
    }

    // ─────────────────────────────────────────────
    //  小工具
    // ─────────────────────────────────────────────
    let toastTimer;
    function toast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.toggle('error', isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 4000 : 2200);
    }
    function setStatus(text) { document.getElementById('status-left').textContent = text; }
    function formatSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(2) + ' MB';
    }
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }
    function showOverlay(show, text) {
      const o = document.getElementById('overlay');
      o.classList.toggle('show', show);
      if (text) o.querySelector('.overlay-text').textContent = text;
    }

    // ─────────────────────────────────────────────
    //  状态
    // ─────────────────────────────────────────────
    let templateFile = null, templateBuf = null;   // 模板：File 与原始 ArrayBuffer
    let tableFile = null;                          // 表格
    let tableHeaders = null;                       // 表格表头（待替换文本，不含文件名列）
    let pairColors = [];                           // [{search,color}] 颜色映射，全流程共用
    let parsedTable = null;                        // {headers, rows} 已解析表格，供转换复用
    let results = [];                              // [{name, blob, pairs}]
    let activeIdx = -1;

    // ─────────────────────────────────────────────
    //  屏幕切换
    // ─────────────────────────────────────────────
    function showScreen(name) {
      const upload = document.getElementById('upload-screen');
      const resultsEl = document.getElementById('results-screen');
      const convertBtn = document.getElementById('convert-btn');
      const backBtn = document.getElementById('back-btn');
      const dlAll = document.getElementById('download-all-btn');
      const cnt = document.getElementById('result-count');
      const sampleBtn = document.getElementById('sample-btn');
      if (name === 'results') {
        upload.style.display = 'none';
        resultsEl.style.display = 'flex';
        resultsEl.classList.remove('hidden');
        convertBtn.style.display = 'none';
        backBtn.style.display = '';
        dlAll.style.display = results.length ? '' : 'none';
        cnt.style.display = results.length ? '' : 'none';
        cnt.textContent = `共 ${results.length} 个文件`;
        sampleBtn.style.display = 'none';
      } else {
        upload.style.display = 'flex';
        resultsEl.style.display = 'none';
        resultsEl.classList.add('hidden');
        convertBtn.style.display = '';
        backBtn.style.display = 'none';
        dlAll.style.display = 'none';
        cnt.style.display = 'none';
        sampleBtn.style.display = '';
      }
    }

    // ─────────────────────────────────────────────
    //  上传交互
    // ─────────────────────────────────────────────
    function setupDropzone(zoneId, inputId, kind) {
      const zone = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      const card = zone.querySelector('.file-card');
      const nameEl = card.querySelector('.file-name');
      const sizeEl = card.querySelector('.file-size');
      const replaceBtn = card.querySelector('.replace-btn');
      const removeBtn = card.querySelector('.remove-btn');
      const previewEl = zone.querySelector('.dz-preview');

      function acceptFile(file) {
        const name = file.name.toLowerCase();
        if (kind === 'template') {
          if (name.endsWith('.doc') && !name.endsWith('.docx')) {
            toast('请上传 .docx 模板（不支持旧版 .doc，可在 Word 里另存为 .docx）', true);
            return;
          }
          if (!name.endsWith('.docx')) { toast('模板仅支持 .docx 文件', true); return; }
        } else {
          if (!name.endsWith('.xlsx') && !name.endsWith('.xls')) { toast('表格仅支持 .xlsx/.xls 文件', true); return; }
        }
        setFile(kind, file);
      }

      zone.addEventListener('click', (e) => {
        if (zone.classList.contains('has-file')) return;        // 已有文件时点卡片空白不触发
        if (e.target.closest('.file-actions')) return;           // 点按钮不触发选择
        input.click();
      });
      zone.addEventListener('dblclick', (e) => { /* 防止误触 */ });
      input.addEventListener('change', (e) => {
        const f = e.target.files[0]; e.target.value = '';
        if (f) acceptFile(f);
      });
      replaceBtn.addEventListener('click', (e) => { e.stopPropagation(); input.click(); });
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation(); setFile(kind, null);
      });

      // 拖拽
      const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
      let dragCnt = 0;
      zone.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragCnt++; zone.classList.add('drag-over'); });
      zone.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); });
      zone.addEventListener('dragleave', () => { dragCnt--; if (dragCnt <= 0) { dragCnt = 0; zone.classList.remove('drag-over'); } });
      zone.addEventListener('drop', (e) => {
        if (!hasFiles(e)) return; e.preventDefault(); dragCnt = 0; zone.classList.remove('drag-over');
        const f = e.dataTransfer.files[0]; if (f) acceptFile(f);
      });

      function setFile(kind, file) {
        if (kind === 'template') {
          templateFile = file;
          if (file) {
            // 读取为 ArrayBuffer 缓存
            previewEl.innerHTML = '<div class="preview-empty">渲染中…</div>';
            file.arrayBuffer().then(buf => { templateBuf = buf; renderTemplatePreview(buf); updateConvertBtn(); });
            zone.classList.add('has-file');
            nameEl.textContent = file.name;
            sizeEl.textContent = formatSize(file.size);
          } else {
            templateBuf = null;
            zone.classList.remove('has-file');
            previewEl.innerHTML = '';
            updateConvertBtn();
          }
        } else {
          tableFile = file;
          if (file) {
            zone.classList.add('has-file');
            nameEl.textContent = file.name;
            sizeEl.textContent = formatSize(file.size);
            loadTable(file);
          } else {
            tableFile = null;
            parsedTable = null; tableHeaders = null; pairColors = [];
            zone.classList.remove('has-file');
            previewEl.innerHTML = '';
            refreshTemplatePreviewHighlight();
          }
          updateConvertBtn();
        }
      }
      // 暴露内部 setFile 给外部（setFile 在闭包内）
      zone._setFile = setFile;
    }

    function setFile(kind, file) {
      const zoneId = kind === 'template' ? 'tpl-zone' : 'tbl-zone';
      document.getElementById(zoneId)._setFile(kind, file);
    }

    function updateConvertBtn() {
      const btn = document.getElementById('convert-btn');
      const ready = !!(templateFile && templateBuf && tableFile);
      btn.disabled = !ready;
      setStatus(ready ? '已就绪，点击转换。' : '请上传模板与表格。');
    }

    // ─────────────────────────────────────────────
    //  表格读取 + 校验
    //  返回 { headers: [search...], rows: [[name, v1, v2, ...], ...] }
    // ─────────────────────────────────────────────
    async function parseTable(file) {
      const X = await ensureXLSX();
      const buf = await file.arrayBuffer();
      const wb = X.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      if (!ws) throw new Error('表格中没有工作表');
      const raw = X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      const rows = raw.map(r => (r || []).map(v => (v == null ? '' : String(v))));
      if (!rows.length) throw new Error('表格为空');
      const header = rows[0].map(h => (h == null ? '' : String(h).trim()));
      if (!header.length || header[0] !== '文件名') {
        throw new Error('表格第一行第一列必须为「文件名」');
      }
      const headers = header.slice(1);   // 待替换文本
      return { headers, rows: rows.slice(1) };
    }

    // ─────────────────────────────────────────────
    //  分屏预览
    // ─────────────────────────────────────────────
    async function renderTemplatePreview(buf) {
      const el = document.querySelector('#tpl-zone .dz-preview');
      el.innerHTML = '<div class="preview-empty">渲染中…</div>';
      try {
        const lib = await ensureDocxPreview();
        el.innerHTML = '';
        await lib.renderAsync(buf.slice(0), el);
        // 两个文件都就绪时，对模板中命中的替换词着色
        if (tableHeaders && pairColors.length) {
          highlightContainer(el, pairColors.map(p => ({ text: p.search, color: p.color })));
        }
      } catch (e) {
        el.innerHTML = `<div class="preview-empty">预览失败：${e.message}</div>`;
      }
    }

    // 读取并解析表格：存储 headers/颜色映射，渲染带列色的预览，并在模板就绪时刷新其高亮
    async function loadTable(file) {
      const el = document.querySelector('#tbl-zone .dz-preview');
      el.innerHTML = '<div class="preview-empty">渲染中…</div>';
      try {
        const parsed = await parseTable(file);
        parsedTable = parsed;
        tableHeaders = parsed.headers;
        pairColors = parsed.headers.map((h, i) => ({ search: h, color: colorOf(i) }));
        renderColoredTable(el, parsed.headers, parsed.rows);
        refreshTemplatePreviewHighlight();
      } catch (e) {
        parsedTable = null; tableHeaders = null; pairColors = [];
        el.innerHTML = `<div class="preview-empty">预览失败：${e.message}</div>`;
        refreshTemplatePreviewHighlight();
      }
    }

    function renderColoredTable(el, headers, rows) {
      const tbl = document.createElement('table');
      tbl.className = 'tbl-preview';
      const colColor = (c) => c >= 1 ? pairColors[c - 1].color : null;

      const htr = tbl.insertRow();
      ['文件名', ...headers].forEach((txt, c) => {
        const td = htr.insertCell();
        td.textContent = txt;
        const color = colColor(c);
        if (color) { td.style.backgroundColor = color; td.classList.add('col-hl-head'); }
      });

      rows.slice(0, 200).forEach(row => {
        const tr = tbl.insertRow();
        const arr = ['文件名', ...headers].map((_, c) => row[c] == null ? '' : String(row[c]));
        arr.forEach((val, c) => {
          const td = tr.insertCell();
          td.textContent = val;
          const color = colColor(c);
          if (color) {
            td.style.backgroundColor = hexToRgba(color, 0.16);
            td.style.borderLeft = `2px solid ${color}`;
            td.classList.add('col-hl-data');
          }
        });
      });
      el.innerHTML = '';
      el.appendChild(tbl);
    }

    function refreshTemplatePreviewHighlight() {
      if (templateBuf) renderTemplatePreview(templateBuf);
    }

    // ─────────────────────────────────────────────
    //  预览 HTML 高亮（跨文本节点精确包裹，颜色可控、不污染下载文件）
    //  terms: [{ text, color }]  命中 text 的连续字符用 color 背景包裹
    // ─────────────────────────────────────────────
    const BLOCK_TAGS = new Set([
      'P', 'DIV', 'LI', 'TD', 'TH', 'TR', 'TABLE', 'SECTION', 'ARTICLE',
      'HEADER', 'FOOTER', 'MAIN', 'ASIDE', 'BLOCKQUOTE',
      'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'FIGURE', 'FIGCAPTION', 'DD', 'DT', 'DL',
    ]);

    function closestBlock(node, container) {
      let n = node.parentNode;
      while (n && n !== container) {
        if (n.nodeType === 1 && BLOCK_TAGS.has(n.tagName)) return n;
        n = n.parentNode;
      }
      return container;
    }

    function collectTextNodes(container) {
      const out = [];
      const w = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
      while (w.nextNode()) {
        const tn = w.currentNode;
        if (tn.textContent && tn.textContent.length) out.push(tn);
      }
      return out;
    }

    // 把 [start,end) 范围（charMap 索引）的连续文本包裹进着色 span
    function wrapRange(charMap, start, end, color) {
      const segs = [];
      let i = start;
      while (i < end) {
        const node = charMap[i].node;
        let j = i;
        while (j < end && charMap[j].node === node) j++;
        segs.push({ node, s: charMap[i].offset, e: charMap[j - 1].offset + 1 });
        i = j;
      }
      for (const seg of segs) {
        const { node, s, e } = seg;
        if (e < node.length) node.splitText(e);             // 先切出尾，node 保留 [0,e)
        const matchNode = s > 0 ? node.splitText(s) : node;  // 再切出命中段 [s,e)
        const span = document.createElement('span');
        span.className = 'wr-hl';
        span.style.backgroundColor = color;
        matchNode.parentNode.insertBefore(span, matchNode);
        span.appendChild(matchNode);
      }
    }

    // 对一组连续文本节点（同一块内）做查找 + 包裹
    function highlightGroup(textNodes, terms) {
      let full = '';
      const charMap = [];
      for (const tn of textNodes) {
        const s = tn.textContent || '';
        for (let k = 0; k < s.length; k++) charMap.push({ node: tn, offset: k });
        full += s;
      }
      if (!full) return;

      const ranges = [];
      const taken = new Array(full.length).fill(false);
      for (const t of terms) {
        const needle = t.text;
        if (!needle) continue;
        let from = 0;
        for (; ;) {
          const idx = full.indexOf(needle, from);
          if (idx < 0) break;
          const end = idx + needle.length;
          let overlap = false;
          for (let k = idx; k < end; k++) if (taken[k]) { overlap = true; break; }
          if (!overlap) {
            for (let k = idx; k < end; k++) taken[k] = true;
            ranges.push({ start: idx, end, color: t.color });
            from = end;
          } else {
            from = idx + 1;
          }
        }
      }
      // 降序应用：先包裹靠后的范围，切分只截断节点右尾，靠前的 charMap 引用仍有效
      ranges.sort((a, b) => b.start - a.start);
      for (const r of ranges) wrapRange(charMap, r.start, r.end, r.color);
    }

    function highlightContainer(container, terms) {
      const clean = terms.filter(t => t && t.text && t.text.length);
      if (!clean.length) return;
      const nodes = collectTextNodes(container);
      if (!nodes.length) return;

      let group = [];
      let groupBlock = null;
      const flush = () => { if (group.length) { highlightGroup(group, clean); group = []; } };
      for (const tn of nodes) {
        const blk = closestBlock(tn, container);
        if (blk !== groupBlock) { flush(); groupBlock = blk; }
        group.push(tn);
      }
      flush();
    }

    // ─────────────────────────────────────────────
    //  docx run 感知查找替换（核心）
    // ─────────────────────────────────────────────
    const isTextPart = (name) =>
      name === 'word/document.xml' || /^word\/(header|footer)[0-9]*\.xml$/.test(name);

    function directTNodes(r) {
      const out = [];
      for (const c of Array.from(r.childNodes)) {
        if (c.nodeType === 1 && c.namespaceURI === W_NS && c.localName === 't') out.push(c);
      }
      return out;
    }

    function ancestorParagraph(el) {
      let n = el.parentNode;
      while (n && n.nodeType === 1) {
        if (n.namespaceURI === W_NS && n.localName === 'p') return n;
        n = n.parentNode;
      }
      return null;
    }

    /** 收集按段落分组的 run 列表（每个 w:r 恰好归入其最近的 w:p，避免嵌套文本框重复处理） */
    function collectParaGroups(doc) {
      const runs = doc.getElementsByTagNameNS(W_NS, 'r');
      const groups = new Map();
      const order = [];
      for (let i = 0; i < runs.length; i++) {
        const r = runs[i];
        const p = ancestorParagraph(r);
        if (!p) continue;
        if (!groups.has(p)) { groups.set(p, []); order.push(p); }
        groups.get(p).push(r);
      }
      return order.map(p => ({ p, runs: groups.get(p) }));
    }

    /** 从一组 run 构建全文本与字符→run 映射 */
    function buildText(runs) {
      const entries = [];
      let fullText = '';
      const charMap = [];
      for (const r of runs) {
        const tNodes = directTNodes(r);
        if (!tNodes.length) continue;
        const text = tNodes.map(t => t.textContent || '').join('');
        const ei = entries.length;
        entries.push({ runEl: r, tNodes, text });
        for (let off = 0; off < text.length; off++) charMap.push({ ei, off });
        fullText += text;
      }
      return { entries, fullText, charMap };
    }

    function setTText(tEl, text) {
      tEl.textContent = text;
      tEl.setAttributeNS(XML_NS, 'xml:space', 'preserve');
    }

    /** 把单条匹配替换进 entries（操作实际 DOM） */
    function applyMatch(entries, charMap, start, end, replace) {
      const firstEi = charMap[start].ei;
      const lastEi = charMap[end].ei;
      const first = entries[firstEi];
      const last = entries[lastEi];
      const beforeText = first.text.slice(0, charMap[start].off);
      const afterText = last.text.slice(charMap[end].off + 1);

      const setEntryText = (entry, text) => {
        // 全部文本写入首个 tNode，其余 tNode 清空；非 t 子节点（tab/br 等）保留
        if (entry.tNodes.length === 1) {
          setTText(entry.tNodes[0], text);
        } else {
          setTText(entry.tNodes[0], text);
          for (let k = 1; k < entry.tNodes.length; k++) setTText(entry.tNodes[k], '');
        }
        entry.text = text;
      };

      if (firstEi === lastEi) {
        setEntryText(first, beforeText + replace + afterText);
      } else {
        setEntryText(first, beforeText + replace);
        for (let ei = firstEi + 1; ei < lastEi; ei++) setEntryText(entries[ei], '');
        setEntryText(last, afterText);
      }
    }

    function replaceInGroup(runs, pairs) {
      for (const { search, replace } of pairs) {
        if (!search) continue;
        let from = 0, guard = 0;
        while (guard++ < 1000000) {
          const { entries, fullText, charMap } = buildText(runs);
          if (!fullText) break;
          if (from > fullText.length) break;
          const idx = fullText.indexOf(search, from);
          if (idx < 0) break;
          const end = idx + search.length - 1;
          if (end >= charMap.length) break;
          applyMatch(entries, charMap, idx, end, replace);
          from = idx + replace.length;   // 跳过替换区，避免 replace 含 search 时死循环
        }
      }
    }

    function replaceInXmlPart(xmlText, pairs) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) {
        console.warn('XML 解析失败，跳过该 part');
        return xmlText;
      }
      const groups = collectParaGroups(doc);
      for (const g of groups) replaceInGroup(g.runs, pairs);

      let out = new XMLSerializer().serializeToString(doc);
      if (!out.startsWith('<?xml')) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out;
      return out;
    }

    /** 生成 zip Blob（兼容 pizzip 同步 generate 与 jszip 风格 generateAsync） */
    async function zipGenerate(zip) {
      let blob;
      try {
        const r = zip.generate({ type: 'blob' });
        blob = (r && typeof r.then === 'function') ? await r : r;
      } catch (e) {
        if (typeof zip.generateAsync === 'function') blob = await zip.generateAsync({ type: 'blob' });
        else throw e;
      }
      return new Blob([blob], { type: DOCX_MIME });
    }

    // ─────────────────────────────────────────────
    //  转换主流程
    // ─────────────────────────────────────────────
    async function doConvert() {
      if (!(templateFile && templateBuf && tableFile)) return;
      showOverlay(true, '加载库与表格…');
      setStatus('处理中…');
      try {
        const { headers, rows } = parsedTable && parsedTable.headers.length
          ? parsedTable : await parseTable(tableFile);
        if (!rows.length) throw new Error('表格没有数据行');
        await ensurePizip();
        const P = window.PizZip;

        results = [];
        const seen = new Set();
        const skipped = [];

        for (let ri = 0; ri < rows.length; ri++) {
          if (ri % 5 === 0) { showOverlay(true, `生成中… ${ri}/${rows.length}`); await new Promise(r => setTimeout(r)); }
          const row = rows[ri];
          const fname = (row[0] == null ? '' : String(row[0])).trim();
          if (!fname) { skipped.push(`第 ${ri + 2} 行：文件名为空，已跳过`); continue; }
          const base = fname.replace(/\.docx?$/i, '');
          const outName = base + '.docx';
          if (seen.has(outName.toLowerCase())) { skipped.push(`第 ${ri + 2} 行：文件名「${outName}」重复，已跳过`); continue; }
          seen.add(outName.toLowerCase());

          const pairs = [];
          for (let ci = 0; ci < headers.length; ci++) {
            const search = headers[ci];
            if (!search) continue;
            const replace = row[ci + 1] == null ? '' : String(row[ci + 1]);
            pairs.push({ search, replace, color: colorOf(ci) });
          }

          const zip = new P(templateBuf.slice(0));   // 每行从模板副本新建
          const partNames = Object.keys(zip.files).filter(isTextPart);
          for (const name of partNames) {
            const xml = zip.file(name).asText();
            const newXml = replaceInXmlPart(xml, pairs);
            zip.file(name, newXml);
          }
          const blob = await zipGenerate(zip);
          results.push({ name: outName, blob, pairs });
        }

        if (!results.length) throw new Error('没有生成任何文件（请检查表格文件名列）');
        renderResults();
        showScreen('results');
        setStatus(`生成 ${results.length} 个文件。${skipped.length ? skipped.join('；') : ''}`);
        if (skipped.length) toast(skipped.join('\n'));
        activeIdx = 0;
        selectResult(0);
      } catch (err) {
        console.error(err);
        toast('转换失败：' + err.message, true);
        setStatus('转换失败：' + err.message);
      } finally {
        showOverlay(false);
      }
    }

    // ─────────────────────────────────────────────
    //  结果界面
    // ─────────────────────────────────────────────
    function renderResults() {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      results.forEach((r, i) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.dataset.idx = i;
        item.innerHTML =
          `<span class="seq">${i + 1}.</span>` +
          `<span class="fname" title="${r.name}">${r.name}</span>` +
          `<button class="dl-btn">下载</button>`;
        item.addEventListener('click', (e) => {
          if (e.target.closest('.dl-btn')) return;
          selectResult(i);
        });
        item.querySelector('.dl-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          downloadBlob(r.blob, r.name);
        });
        list.appendChild(item);
      });
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderReplacePanel(r) {
      const panel = document.getElementById('replace-panel');
      const body = panel.querySelector('.rp-body');
      const title = panel.querySelector('.rp-title');
      if (!r || !r.pairs || !r.pairs.length) { panel.style.display = 'none'; return; }
      title.textContent = `替换情况 · ${r.name}`;
      let html = '<table class="rp-table"><thead><tr><th>替换词</th><th>替换为</th></tr></thead><tbody>';
      r.pairs.forEach(p => {
        const bg = hexToRgba(p.color, 0.22);
        const replaceCell = p.replace
          ? esc(p.replace)
          : '<span style="color:#999">（空）</span>';
        html += `<tr style="background:${bg};box-shadow:inset 4px 0 0 ${p.color}">` +
          `<td class="rp-search">${esc(p.search)}</td>` +
          `<td class="rp-replace">${replaceCell}</td></tr>`;
      });
      html += '</tbody></table>';
      body.innerHTML = html;
      panel.style.display = '';
    }

    async function selectResult(i) {
      activeIdx = i;
      document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === i);
      });
      const content = document.getElementById('preview-content');
      const r = results[i];
      renderReplacePanel(r);
      content.innerHTML = '<div class="preview-empty">渲染预览中…</div>';
      try {
        const lib = await ensureDocxPreview();
        const buf = await r.blob.arrayBuffer();
        content.innerHTML = '';
        await lib.renderAsync(buf, content);
        // 对被替换文本着色（颜色与上传界面一致）
        if (r.pairs && r.pairs.length) {
          highlightContainer(content, r.pairs.map(p => ({ text: p.replace, color: p.color })));
        }
      } catch (err) {
        content.innerHTML = `<div class="preview-empty">预览失败：${err.message}</div>`;
      }
    }

    async function downloadAllZip() {
      if (!results.length) return;
      showOverlay(true, '打包中…');
      try {
        await ensurePizip();
        const P = window.PizZip;
        const zip = new P();
        for (const r of results) {
          zip.file(r.name, await r.blob.arrayBuffer());
        }
        const blob = await zipGenerate(zip);
        downloadBlob(blob, '替换结果.zip');
      } catch (err) {
        toast('打包失败：' + err.message, true);
      } finally {
        showOverlay(false);
      }
    }

    // 从同目录加载示例文件（sample.docx / sample.xlsx），需 http 部署
    async function loadSample() {
      const btn = document.getElementById('sample-btn');
      btn.disabled = true;
      setStatus('加载示例文件…');
      try {
        const [dBlob, xBlob] = await Promise.all([
          fetch('sample.docx').then(r => r.ok ? r.blob() : Promise.reject(new Error(`sample.docx ${r.status}`))),
          fetch('sample.xlsx').then(r => r.ok ? r.blob() : Promise.reject(new Error(`sample.xlsx ${r.status}`))),
        ]);
        const docxF = new File([dBlob], 'sample.docx', { type: DOCX_MIME });
        const xlsxF = new File([xBlob], 'sample.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        setFile('template', docxF);
        setFile('table', xlsxF);
        toast('已加载示例文件');
      } catch (e) {
        toast('加载示例失败：' + e.message + '（需通过 http 部署后访问）', true);
        setStatus('加载示例失败：' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    // 浮窗：收起/展开 + 拖动
    function initReplacePanel() {
      const panel = document.getElementById('replace-panel');
      const head = panel.querySelector('.rp-head');
      const toggle = panel.querySelector('.rp-toggle');
      const body = panel.querySelector('.rp-body');
      toggle.addEventListener('click', () => {
        const collapsed = panel.classList.toggle('collapsed');
        body.style.display = collapsed ? 'none' : '';
        toggle.textContent = collapsed ? '+' : '—';
      });
      let dragging = false, sx = 0, sy = 0, px = 0, py = 0;
      head.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;
        dragging = true;
        const rect = panel.getBoundingClientRect();
        const host = panel.offsetParent || panel.parentNode;
        const hostRect = host.getBoundingClientRect();
        px = rect.left - hostRect.left;
        py = rect.top - hostRect.top;
        sx = e.clientX; sy = e.clientY;
        panel.style.right = 'auto';
        panel.style.left = px + 'px';
        panel.style.top = py + 'px';
        e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        panel.style.left = (px + e.clientX - sx) + 'px';
        panel.style.top = (py + e.clientY - sy) + 'px';
      });
      document.addEventListener('mouseup', () => { dragging = false; });
    }

    // ─────────────────────────────────────────────
    //  事件绑定 + 初始化
    // ─────────────────────────────────────────────
    document.getElementById('convert-btn').addEventListener('click', doConvert);
    document.getElementById('back-btn').addEventListener('click', () => showScreen('upload'));
    document.getElementById('download-all-btn').addEventListener('click', downloadAllZip);
    document.getElementById('sample-btn').addEventListener('click', loadSample);
    (function () {
      const cb = document.getElementById('hl-checkbox');
      cb.addEventListener('change', () => {
        document.body.classList.toggle('hl-off', !cb.checked);
      });
    })();

    setupDropzone('tpl-zone', 'tpl-input', 'template');
    setupDropzone('tbl-zone', 'tbl-input', 'table');
    initReplacePanel();

    showScreen('upload');
    setStatus('就绪。上传模板与表格后即可转换。');
  </script>
</body>

</html>
